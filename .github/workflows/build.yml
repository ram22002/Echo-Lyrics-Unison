name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :ext:test --stacktrace
      - name: Plugin jar
        run: ./gradlew :ext:shadowJar --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: echo_lyrics_unison-jar
          path: ext/build/libs/*.jar

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
      - name: Build eapk
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          chmod +x ./gradlew
          version=$(git rev-parse --short HEAD)
          args=()
          if [ -n "$KEYSTORE_B64" ] && [ -n "$PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"
            # Only sign when the secrets really open alias key0; a stale secret pair must not
            # turn the build red, and an unsigned artifact is still installable.
            if keytool -list -keystore "$GITHUB_WORKSPACE/signing-key.jks" \
                -storepass "$PASSWORD" -alias key0 > /dev/null 2>&1; then
              args=(
                -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing-key.jks"
                -Pandroid.injected.signing.store.password="$PASSWORD"
                -Pandroid.injected.signing.key.alias=key0
                -Pandroid.injected.signing.key.password="$PASSWORD"
              )
            else
              echo "::warning::KEYSTORE_B64 and PASSWORD do not open alias key0; building an unsigned .eapk."
              echo "--- keystore diagnostics ---"
              stat -c 'keystore bytes: %s' "$GITHUB_WORKSPACE/signing-key.jks" || true
              head -c 8 "$GITHUB_WORKSPACE/signing-key.jks" | od -An -tx1 || true
              keytool -list -keystore "$GITHUB_WORKSPACE/signing-key.jks" -storepass "$PASSWORD" 2>&1 | head -12 || true
              echo "--- end diagnostics ---"
            fi
          fi
          ./gradlew :app:assembleDebug "${args[@]}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/echo_lyrics_unison-$version.eapk"
      - name: Publish release
        if: hashFiles('dist/*.eapk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.sha }}
          name: Unison ${{ github.sha }}
          files: dist/*.eapk
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: echo_lyrics_unison-eapk
          path: dist/*.eapk
